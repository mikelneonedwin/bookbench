[package]
name = "lopdf-stamper"
version = "0.1.0"
edition = "2021"

[dependencies]
lopdf = "0.34"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
